<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine 💘</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background: linear-gradient(135deg,#ffd1dc,#ffb6c1);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

.container{
  text-align:center;
  width:90%;
  max-width:700px;
}

h1{
  color:#b1003a;
  font-size:40px;
  margin-bottom:20px;
}

img{
  width:200px;
  margin-bottom:20px;
}

.buttons{
  position:relative;
  height:180px;
}

#yes{
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:18px;
  font-size:50px;
  padding:30px 80px;
  font-weight:bold;
  cursor:pointer;
  position:absolute;
  left:10%;
}

#no{
  background:#ff4d6d;
  color:white;
  border:none;
  border-radius:12px;
  font-size:14px;
  padding:10px 15px;
  cursor:pointer;
  position:absolute;
  right:15%;
  top:90px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💕</h1>

  <!-- STICKER -->
  <img src="sticker.gif" alt="cute sticker">

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No 😅</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const area = document.querySelector(".buttons");

let count = 0;
let scale = 1;

const texts = [
  "No 😅",
  "Are you sure? 🥺",
  "Pleaseeee 🙃",
  "I’ll be sad 😭",
  "Don’t break my heart 💔",
  "Okay stop 😂"
];

function moveNo(){
  const maxX = area.clientWidth - noBtn.offsetWidth;
  const maxY = area.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random()*maxX + "px";
  noBtn.style.top  = Math.random()*maxY + "px";
}

function growYes(){
  count++;
  scale = Math.min(1 + count*0.15, 2.3);
  yesBtn.style.transform = `scale(${scale})`;
  noBtn.textContent = texts[Math.min(count,texts.length-1)];
}

noBtn.addEventListener("mouseenter", ()=>{
  growYes();
  moveNo();
});

noBtn.addEventListener("click", e=>{
  e.preventDefault();
  growYes();
  moveNo();
});

yesBtn.addEventListener("click", ()=>{
  document.body.innerHTML = `
    <div style="text-align:center;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:linear-gradient(135deg,#ffd1dc,#ffb6c1);
      font-family:Arial">
      <h1 style="color:#b1003a;font-size:48px">
        Knew you would say YES! 🎉💖
      </h1>
      <p style="font-size:22px;color:#7a0030">
        You just made me the happiest person 🥰
      </p>
      <p style="font-weight:bold;color:#b1003a">
        Happy Valentine 💘
      </p>
    </div>
  `;
});
</script>

</body>
</html>
