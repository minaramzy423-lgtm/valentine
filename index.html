<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Valentine 💘</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 30% 20%, #ffd1dc, #ffb6c1);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
      text-align:center;
    }

    .wrap{
      width:90%;
      max-width:700px;
    }

    h1{
      color:#b1003a;
      font-size: clamp(26px,5vw,44px);
      font-weight:900;
      margin-bottom:12px;
    }

    #sticker{
      width:220px;
      max-width:60vw;
      border-radius:16px;
      box-shadow:0 10px 20px rgba(0,0,0,.15);
      background:rgba(255,255,255,.3);
    }

    #caption{
      margin-top:8px;
      font-weight:800;
      color:#7a0030;
      min-height:24px;
    }

    .buttons{
      position:relative;
      height:200px;
      margin-top:20px;
    }

    button{
      border:none;
      cursor:pointer;
      font-weight:900;
      box-shadow:0 12px 26px rgba(0,0,0,.15);
      transition:transform .15s ease;
    }

    #yes{
      position:absolute;
      left:10%;
      top:40px;
      background:#2ecc71;
      color:white;
      font-size:clamp(32px,6vw,60px);
      padding:30px 80px;
      border-radius:20px;
    }

    #no{
      position:absolute;
      right:12%;
      top:100px;
      background:#ff4d6d;
      color:white;
      font-size:14px;
      padding:10px 16px;
      border-radius:12px;
      white-space:nowrap;
    }

    .heart{
      position:fixed;
      top:-20px;
      pointer-events:none;
      animation:fall linear forwards;
    }

    @keyframes fall{
      to{ transform:translateY(110vh); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Mahra 💖 will you be my Valentine?</h1>

    <img id="sticker" src="sticker1.png.jpeg" alt="sticker">

    <div id="caption">Be nice Mahra 😇</div>

    <div class="buttons" id="area">
      <button id="yes">Yes</button>
      <button id="no">No 😅</button>
    </div>
  </div>

<script>
  const yesBtn = document.getElementById("yes");
  const noBtn  = document.getElementById("no");
  const area   = document.getElementById("area");
  const stickerImg = document.getElementById("sticker");
  const caption = document.getElementById("caption");

  let noCount = 0;
  let yesScale = 1;

  const stickers = [
    "sticker1.png.jpeg",
    "sticker2.png.jpeg",
    "sticker3.png.jpeg",
    "sticker4.png.jpeg",
    "sticker5.png.jpeg",
    "sticker6.png.jpeg",
    "sticker7.png.jpeg"
  ];

  const captions = [
    "Come on Mahra 🥺",
    "Don’t be mean 😭",
    "My heart can’t take this 💔",
    "Please say yes 😤",
    "Last chance Mahra 😈",
    "Okay you’re scary now 😂",
    "Just press YES 💘"
  ];

  function moveNo(){
    const maxX = area.clientWidth - noBtn.offsetWidth;
    const maxY = area.clientHeight - noBtn.offsetHeight;
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top  = Math.random() * maxY + "px";
  }

  function onNo(){
    noCount++;

    yesScale = Math.min(1 + noCount * 0.15, 2.4);
    yesBtn.style.transform = `scale(${yesScale})`;

    stickerImg.src = stickers[Math.floor(Math.random() * stickers.length)];
    caption.textContent = captions[Math.min(noCount-1, captions.length-1)];

    moveNo();
  }

  noBtn.addEventListener("mouseenter", onNo);
  noBtn.addEventListener("click", onNo);
  noBtn.addEventListener("touchstart", e => {
    e.preventDefault();
    onNo();
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
                  background:radial-gradient(circle,#ffd1dc,#ffb6c1);text-align:center;">
        <div>
          <h1 style="color:#b1003a;font-size:48px;font-weight:900;">
            I knew it Mahra! 💖🎉
          </h1>
          <p style="font-size:22px;font-weight:800;color:#7a0030;">
            You just made me the happiest person 🥰
          </p>
          <p style="font-size:20px;font-weight:900;color:#b1003a;">
            Happy Valentine 💘
          </p>
        </div>
      </div>
    `;

    let i=0;
    const timer=setInterval(()=>{
      const h=document.createElement("div");
      h.className="heart";
      h.textContent=Math.random()>0.5?"💖":"💘";
      h.style.left=Math.random()*100+"vw";
      h.style.fontSize=(16+Math.random()*20)+"px";
      h.style.animationDuration=(2+Math.random()*3)+"s";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),6000);
      if(++i>80) clearInterval(timer);
    },120);
  });

  moveNo();
</script>
</body>
</html>
